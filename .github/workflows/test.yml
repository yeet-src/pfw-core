name: test

# The host-side suites: everything that needs no kernel and no yeet runtime.
#
#   check-isa          src/isa.js and bpf/include/pfw.h agree on every opcode
#                      and register number
#   examples           every examples/ and contrib/ program compiles, and the
#                      showcase programs behave as documented
#   test/isa           the ISA conformance vectors (docs/isa, all 64 opcodes)
#   test/unit          the compiler, assembler, DSL and reference interpreter
#
# The first two run under plain node. test/isa and test/unit are `yeet test`
# suites, so that job installs yeet (the documented installer; no login is
# needed to run tests) and waits for its daemon, which `yeet test` runs modules
# through.
#
# And one that does need a kernel:
#
#   kernel             every test under test/kernel/: the VM loaded into the
#                      runner's own kernel, a program applied, and real traffic
#                      sent over loopback — what the kernel does with a packet,
#                      where the suites above are what the reference interpreter
#                      says it should. One test for each thing that can only go
#                      wrong there: reassembly (segments larger than the window,
#                      a connection older than the program), what the counters
#                      count, routing and stage programs, regex DFAs, rewrite…
#
# Whether each supported kernel's verifier accepts the VM is the kernel-matrix
# workflow; this job runs the behaviour on the one kernel the runner has.

# Run as a job of the ci workflow (pull requests and pushes to master), which
# only packages and releases if this passes. workflow_dispatch runs it alone.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 24 is the floor: the `#/…` import specifiers the package uses are
        # rejected by node 22.
        node: ['24', '26']
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: ISA / header agreement, examples
        run: npm run test:node

  yeet:
    runs-on: ubuntu-latest
    name: yeet test
    steps:
      - uses: actions/checkout@v4

      - name: Install yeet
        run: |
          set -euo pipefail
          # --no-phone-home: the installer otherwise reports the runner's OS
          # version on exit.
          curl -fsSL https://yeet.cx | sh -s -- --no-phone-home
          yeet version
          # `yeet test` runs its modules through the daemon.
          for i in $(seq 1 30); do systemctl is-active --quiet yeetd && break; sleep 1; done
          systemctl is-active yeetd

      - name: ISA conformance vectors
        run: yeet test test/isa

      - name: Unit suites
        run: yeet test test/unit

  # By category, each on a runner of its own. A test waits about half a minute
  # each time it loads the VM, on these machines, and one after another the
  # whole set is most of an hour; the tests of one category still run serially, since
  # they share that runner's loopback. The categories are GROUPS in
  # scripts/kernel-tests.mjs, which fails if a test is in none of them; a new
  # category needs adding here.
  kernel:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [matching, rewrite, streams, state, host, machine]
    name: kernel tests (${{ matrix.group }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install yeet
        run: |
          set -euo pipefail
          # --no-phone-home: the installer otherwise reports the runner's OS
          # version on exit.
          curl -fsSL https://yeet.cx | sh -s -- --no-phone-home
          yeet version
          # The tests load the VM through the daemon.
          for i in $(seq 1 30); do systemctl is-active --quiet yeetd && break; sleep 1; done
          systemctl is-active yeetd

      - name: Build the BPF object
        run: make bpf

      # Once is enough: every category runs the same kernel.
      - name: The verifier accepts it on this kernel
        if: matrix.group == 'machine'
        run: yeet run scripts/verify-load.mjs

      # Serially: the tests share loopback's XDP hook. Each prints one line; a
      # failure prints the test's whole output under it.
      - name: Kernel tests
        run: |
          uname -r
          npm run test:kernel:all -- --group ${{ matrix.group }}
